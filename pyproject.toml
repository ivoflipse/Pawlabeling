[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawlabeling"
version = "0.3.0"
description = "Clinical Graphics' scientific toolkit"
readme = "readme.md"
license = { text = "BSD-2-Clause" }
authors = [
  { name = "Ivo Flipse", email = "ivoflipse@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Image Processing",
  "License :: OSI Approved :: BSD License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 2.7",
]

[project.urls]
Homepage = "https://github.com/ivoflipse/Pawlabeling"

[project.scripts]
pawlabeling = "pawlabeling_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4.0",
]

[dependency-groups]
dev = [
  "pytest>=7.0",
  "ruff>=0.4.0",
]

[tool.setuptools]
include-package-data = true
license-files = ["COPYING.txt"]

[tool.setuptools.packages.find]
exclude = ["*.debug", "*.debug.*", "debug.*", "debug"]

[tool.setuptools.package-data]
pawlabeling = [
  "**/*.h5",
  "**/*.ini",
  "**/*.json",
  "**/*.log",
  "**/*.png",
  "**/*.zip",
]

[tool.ruff]
line-length = 100
extend-exclude = ["pawlabeling", "docs", "conda-recipe"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
